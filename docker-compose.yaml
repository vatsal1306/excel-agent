services:
    streamlit:
        build:
            context: .
        image: samuel-streamlit:latest
        container_name: samuel-streamlit
        restart: unless-stopped
        stop_grace_period: 5m
        env_file:
            - ./deploy/streamlit.env
        volumes:
            - ./data:/app/data
            - ./Logs:/app/Logs
        ports:
            - "80:8501"
        deploy:
            resources:
                limits:
                    memory: 4G
                    cpus: "2.0"
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"
        healthcheck:
            test: [ "CMD", "curl", "--fail", "http://localhost:8501/_stcore/health" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 90s
